name: ThemisFamily

options:
  bundleIdPrefix: com.kydosdigital
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.10"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    ENABLE_USER_SCRIPT_SANDBOXING: YES

targets:
  ThemisFamily:
    type: application
    platform: iOS
    sources:
      - path: ThemisFamily
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.kydosdigital.themisfamily.dev
        PRODUCT_NAME: ThemisFamily
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Themis Family
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        TARGETED_DEVICE_FAMILY: "1,2"
    scheme:
      testTargets:
        - ThemisFamilyTests

  ThemisFamilyTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: ThemisFamilyTests
    dependencies:
      - target: ThemisFamily
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES

name: iOS visual review

on:
  push:
    branches:
      - "feat/ui-*"
    paths:
      - "apps/ios/**"
      - ".github/workflows/ios-visual-review.yml"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  screenshot:
    runs-on: macos-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        working-directory: apps/ios
        run: xcodegen generate

      - name: Select iPhone simulator
        id: simulator
        shell: bash
        run: |
          DEVICE_ID="$(xcrun simctl list devices available -j | python3 -c 'import json,sys; data=json.load(sys.stdin); print(next(d["udid"] for devices in data.get("devices", {}).values() for d in devices if d.get("isAvailable") and d.get("name", "").startswith("iPhone")))')"
          echo "device_id=$DEVICE_ID" >> "$GITHUB_OUTPUT"
          echo "Using simulator $DEVICE_ID"

      - name: Build release app for Simulator
        working-directory: apps/ios
        run: |
          xcodebuild \
            -project ThemisFamily.xcodeproj \
            -scheme ThemisFamily \
            -configuration Release \
            -destination "platform=iOS Simulator,id=${{ steps.simulator.outputs.device_id }}" \
            -derivedDataPath "$RUNNER_TEMP/ThemisDerivedData" \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Launch and capture canonical screens
        shell: bash
        run: |
          set -euo pipefail
          DEVICE_ID="${{ steps.simulator.outputs.device_id }}"
          BUNDLE_ID="com.kydosdigital.themisfamily.dev"
          APP_PATH="$(find "$RUNNER_TEMP/ThemisDerivedData/Build/Products/Release-iphonesimulator" -maxdepth 1 -name '*.app' | head -1)"
          if [ -z "$APP_PATH" ]; then
            echo "Could not find built .app"
            exit 1
          fi

          OUTPUT="$RUNNER_TEMP/themis-visual-review"
          mkdir -p "$OUTPUT"

          xcrun simctl boot "$DEVICE_ID" || true
          xcrun simctl bootstatus "$DEVICE_ID" -b
          xcrun simctl install "$DEVICE_ID" "$APP_PATH"

          # Give first-boot Simulator system banners time to appear and clear
          # before visual review starts. These are OS chrome, not Themis UI.
          sleep 12

          capture() {
            local perspective="$1"
            local filename="$2"
            xcrun simctl terminate "$DEVICE_ID" "$BUNDLE_ID" || true
            xcrun simctl launch "$DEVICE_ID" "$BUNDLE_ID" --visual-review-perspective "$perspective"
            sleep 8
            xcrun simctl io "$DEVICE_ID" screenshot "$OUTPUT/$filename"
          }

          capture_onboarding() {
            local screen_id="$1"
            local filename="$2"
            xcrun simctl terminate "$DEVICE_ID" "$BUNDLE_ID" || true
            xcrun simctl launch "$DEVICE_ID" "$BUNDLE_ID" \
              --visual-review-perspective onboarding \
              --visual-review-onboarding-screen "$screen_id"
            sleep 8
            xcrun simctl io "$DEVICE_ID" screenshot "$OUTPUT/$filename"
          }

          # Standard Dynamic Type canonical screens. A fresh simulator starts at
          # the normal content size, matching the proven UI-02 capture path.
          capture parent "P-023-canonical.png"
          capture child "C-001-child-canonical.png"
          capture teen "C-001-teen-canonical.png"
          capture rules "R-001-rules-canonical.png"
          capture school-access "S-001-school-access-canonical.png"
          capture task-detail "C-002-task-detail.png"
          capture approval-grace "C-005-approval-grace.png"
          capture games-paused "C-008-games-paused.png"
          capture multiple-restrictions "C-011-multiple-restrictions.png"
          capture action-centre "A-001-action-centre.png"
          capture task-review "P-025-task-review.png"
          capture approval-pending "P-027-approval-pending.png"
          capture approval-applied "P-028-approval-applied.png"
          capture_onboarding P-002 "P-002-welcome.png"
          capture_onboarding P-010 "P-010-pairing.png"
          capture_onboarding P-019 "P-019-agreement.png"
          capture_onboarding P-022 "P-022-activated.png"

          # Approved large-text review target, approximately 170%.
          xcrun simctl ui "$DEVICE_ID" content_size accessibility-large || true
          capture parent "P-023-canonical-accessibility.png"
          capture child "C-001-child-canonical-accessibility.png"
          capture teen "C-001-teen-canonical-accessibility.png"
          capture rules "R-001-rules-canonical-accessibility.png"
          capture school-access "S-001-school-access-canonical-accessibility.png"
          capture approval-grace "C-005-approval-grace-accessibility.png"
          capture task-review "P-025-task-review-accessibility.png"
          capture_onboarding P-019 "P-019-agreement-accessibility.png"
          capture_onboarding P-022 "P-022-activated-accessibility.png"

      - name: Upload visual review screenshots
        uses: actions/upload-artifact@v4
        with:
          name: ui-visual-review
          path: ${{ runner.temp }}/themis-visual-review/*.png
          if-no-files-found: error
          retention-days: 14

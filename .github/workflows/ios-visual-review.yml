name: iOS visual review

on:
  push:
    branches:
      - "feat/ui-*"
    paths:
      - "apps/ios/**"
      - ".github/workflows/ios-visual-review.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  screenshot:
    runs-on: macos-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        working-directory: apps/ios
        run: xcodegen generate

      - name: Select iPhone simulator
        id: simulator
        shell: bash
        run: |
          DEVICE_ID="$(xcrun simctl list devices available -j | python3 -c 'import json,sys; data=json.load(sys.stdin); print(next(d["udid"] for devices in data.get("devices", {}).values() for d in devices if d.get("isAvailable") and d.get("name", "").startswith("iPhone")))')"
          echo "device_id=$DEVICE_ID" >> "$GITHUB_OUTPUT"
          echo "Using simulator $DEVICE_ID"

      - name: Build release app for Simulator
        working-directory: apps/ios
        run: |
          xcodebuild \
            -project ThemisFamily.xcodeproj \
            -scheme ThemisFamily \
            -configuration Release \
            -destination "platform=iOS Simulator,id=${{ steps.simulator.outputs.device_id }}" \
            -derivedDataPath "$RUNNER_TEMP/ThemisDerivedData" \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Launch and capture Parent Home
        shell: bash
        run: |
          set -euo pipefail
          DEVICE_ID="${{ steps.simulator.outputs.device_id }}"
          APP_PATH="$(find "$RUNNER_TEMP/ThemisDerivedData/Build/Products/Release-iphonesimulator" -maxdepth 1 -name '*.app' | head -1)"
          if [ -z "$APP_PATH" ]; then
            echo "Could not find built .app"
            exit 1
          fi

          mkdir -p "$RUNNER_TEMP/themis-visual-review"

          xcrun simctl boot "$DEVICE_ID" || true
          xcrun simctl bootstatus "$DEVICE_ID" -b
          xcrun simctl install "$DEVICE_ID" "$APP_PATH"
          xcrun simctl launch "$DEVICE_ID" com.kydosdigital.themisfamily.dev
          sleep 4
          xcrun simctl io "$DEVICE_ID" screenshot "$RUNNER_TEMP/themis-visual-review/P-023-canonical.png"

          # Capture the same screen at a large accessibility content size.
          xcrun simctl ui "$DEVICE_ID" content_size accessibility-extra-extra-extra-large || true
          xcrun simctl terminate "$DEVICE_ID" com.kydosdigital.themisfamily.dev || true
          xcrun simctl launch "$DEVICE_ID" com.kydosdigital.themisfamily.dev
          sleep 4
          xcrun simctl io "$DEVICE_ID" screenshot "$RUNNER_TEMP/themis-visual-review/P-023-canonical-accessibility.png"

      - name: Upload visual review screenshots
        uses: actions/upload-artifact@v4
        with:
          name: ui-visual-review
          path: ${{ runner.temp }}/themis-visual-review/*.png
          if-no-files-found: error
          retention-days: 14

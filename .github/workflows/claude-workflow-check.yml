name: Claude workflow checks

on:
  push:
    paths:
      - "CLAUDE.md"
      - ".mcp.json"
      - ".env.example"
      - "README.md"
      - ".claude/**"
      - "docs/implementation/**"
      - "apps/ios/**"
      - "supabase/**"
      - "scripts/validate_claude_workflow.py"
      - "scripts/verify.sh"
      - ".github/workflows/claude-workflow-check.yml"
  pull_request:
    paths:
      - "CLAUDE.md"
      - ".mcp.json"
      - ".env.example"
      - "README.md"
      - ".claude/**"
      - "docs/implementation/**"
      - "apps/ios/**"
      - "supabase/**"
      - "scripts/validate_claude_workflow.py"
      - "scripts/verify.sh"
      - ".github/workflows/claude-workflow-check.yml"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up website runtime
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: Install website dependencies
        run: npm ci --prefix apps/web

      - name: Validate Claude Code workflow
        run: bash scripts/verify.sh

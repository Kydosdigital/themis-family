name: Claude workflow checks

on:
  push:
    paths:
      - "CLAUDE.md"
      - ".claude/**"
      - "docs/implementation/**"
      - "scripts/validate_claude_workflow.py"
      - ".github/workflows/claude-workflow-check.yml"
  pull_request:
    paths:
      - "CLAUDE.md"
      - ".claude/**"
      - "docs/implementation/**"
      - "scripts/validate_claude_workflow.py"
      - ".github/workflows/claude-workflow-check.yml"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate Claude Code workflow
        run: python3 scripts/validate_claude_workflow.py
